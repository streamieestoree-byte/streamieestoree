<header class="hd"><div class="w"><a class="br" href="#home">${esc(s.name)} <i>✶</i></a><button class="mm" data-a="mm" aria-expanded="false" aria-controls="nv">Menu</button>
<nav id="nv" aria-label="Utama"><a href="#home">Home</a><a href="#catalog">Catalog</a><a href="#how">How to Order</a><a href="#proof">Proof</a><a href="#contact">Contact</a>${can?'<a href="#admin">Admin</a>':''}</nav></div></header>
<main><section id="home" class="hero gh"><div class="w"><p class="stars" aria-hidden="true">✦ ✶ ✦</p><p class="sm0">${esc(s.name)} ✶</p><h1>${esc(s.head)}</h1><p class="sub">${esc(s.sub)}</p><p class="dsc">${esc(s.desc)}</p>
<div class="bt"><a class="btn y" href="#catalog">Explore Catalog</a><a class="btn o" href="${W}" target="_blank" rel="noopener">Chat Admin</a></div></div></section>
<section id="catalog" class="sec"><div class="w"><h2>the <em>catalog</em></h2><p class="lead">find your little digital favorite.</p>
<div class="fnd"><label class="vh" for="sq">Cari produk, paket, atau durasi</label><input id="sq" type="search" placeholder="Cari: Netflix, 1 Bulan, Canva…" autocomplete="off" value="${esc(q)}"><div id="chips" role="group" aria-label="Kategori"></div></div><div id="list"></div></div></section>
<section id="how" class="sec"><div class="w"><h2>how to <em>order</em></h2><p class="lead">Ordering is simple.</p><div class="steps">
<div class="st"><b>01</b><h3>Explore</h3><p>Jelajahi katalog dan pilih paket yang sesuai dengan kebutuhanmu.</p></div>
<div class="st"><b>02</b><h3>Ask Admin</h3><p>Klik tombol WhatsApp untuk menanyakan ketersediaan atau detail paket.</p></div>
<div class="st"><b>03</b><h3>Confirm</h3><p>Konfirmasikan pilihan paket dan ikuti arahan admin sebelum menyelesaikan pesanan.</p></div></div></div></section>
<section id="proof" class="sec"><div class="w"><div class="pf gl"><h2>little proofs <span class="orn">♡</span></h2><p>A little look at our order proofs.</p><a class="btn s" href="${esc(s.tg)}" target="_blank" rel="noopener">See Order Proofs</a></div></div></section>
<section id="contact" class="ct gh"><div class="w"><p class="stars" aria-hidden="true">✶</p><h2>have something in mind?</h2><p>Punya pertanyaan tentang paket atau ingin memastikan detail pesananmu? Hubungi admin untuk informasi lebih lanjut.</p>
<div class="bt"><a class="btn y" href="${W}" target="_blank" rel="noopener">Chat on WhatsApp</a><a class="btn o" href="${esc(s.tg)}" target="_blank" rel="noopener">View Order Proofs</a></div></div></section></main>
<footer class="ft gh"><div class="w"><p class="br" style="color:#FFFCF5">${esc(s.name)} <i>✶</i></p><p>${esc(s.foot)}</p><p><a href="#catalog">Catalog</a><a href="${W}" target="_blank" rel="noopener">WhatsApp</a><a href="${esc(s.tg)}" target="_blank" rel="noopener">Order Proofs</a></p><p style="font-size:.85rem;opacity:.85">© ${new Date().getFullYear()} ${esc(s.name)}</p></div></footer>`}
/* ---------- admin ---------- */
const sorted=()=>{const cs=[...D.c].sort(by),ix=id=>cs.findIndex(c=>c.id==id);return D.i.filter(i=>(ac=='all'||i.cat==ac)&&(!aq||(cn(i.cat)+' '+i.type+' '+i.dur+' '+i.note).toLowerCase().includes(aq.toLowerCase()))).sort((a,b)=>ix(a.cat)-ix(b.cat)||a.ord-b.ord)};
const alist=()=>sorted().map(i=>`<li class="ai${i.pub?'':' off'}"><div><b>${esc(cn(i.cat))}</b> · ${esc(i.type)}<br>${esc(i.dur)} — <strong>${price(i)}</strong> <em class="pl">${i.pub?'Aktif':'Nonaktif'}</em>${i.note?`<br><small class="mu">${esc(i.note)}</small>`:''}</div><div class="ab"><button class="sx" data-a="ie" data-id="${i.id}">Edit</button><button class="sx" data-a="it" data-id="${i.id}">${i.pub?'Hide':'Show'}</button><button class="sx dg" data-a="id" data-id="${i.id}">Delete</button></div></li>`).join('')||'<li class="mu">Tidak ada produk yang cocok.</li>';
function ap(){if(!can)return `<div class="gt gh"><div class="gc"><h1>Admin streamieestore ✶</h1><p>Halaman ini hanya untuk pemilik toko. Buka halaman ini lewat akun claude.ai pemilik (yang punya akses edit), lalu verifikasi.</p><div class="ac" style="justify-content:center"><button class="btn s" data-a="vf">Verify access</button><button class="btn o2" data-a="ex">Back to shop</button></div></div></div>`;
const cs=[...D.c].sort(by),N=D.i.filter(i=>i.pub&&D.c.some(c=>c.id==i.cat&&c.pub)).length;let b='';
if(av=='ov')b=`<h2>Overview</h2><div class="sg"><div class="sc"><b>${D.c.length}</b>Total kategori<small>${D.c.filter(c=>c.pub).length} tampil</small></div><div class="sc"><b>${D.i.length}</b>Total paket<small>${D.i.filter(i=>i.pub).length} aktif</small></div><div class="sc"><b>${N}</b>Ditampilkan di katalog</div></div><p class="mu">Perubahan baru live setelah kamu menekan Publish changes. Jika halaman ditutup sebelum itu, draft hilang.</p>`;
if(av=='mg')b=`<h2>Manage Catalog</h2><div class="ab"><button class="btn s" data-a="ia">+ Add Product</button><button class="btn o2" data-a="ca">+ Add Category</button></div><h3 style="margin:22px 0 10px">Kategori</h3><ul class="al">${cs.map((c,k)=>`<li class="ai${c.pub?'':' off'}"><div><b>${esc(c.name)}</b> <em class="pl">${c.pub?'Tampil':'Tersembunyi'}</em><br><small class="mu">${D.i.filter(i=>i.cat==c.id).length} paket</small></div><div class="ab"><button class="sx" data-a="cu" data-id="${c.id}" aria-label="Naikkan" ${k?'':'disabled'}>↑</button><button class="sx" data-a="cd" data-id="${c.id}" aria-label="Turunkan" ${k<cs.length-1?'':'disabled'}>↓</button><button class="sx" data-a="ce" data-id="${c.id}">Edit</button><button class="sx" data-a="ct" data-id="${c.id}">${c.pub?'Hide':'Show'}</button><button class="sx dg" data-a="cx" data-id="${c.id}">Delete</button></div></li>`).join('')}</ul>
<h3 style="margin-bottom:6px">Produk</h3><div class="tb fm"><label class="vh" for="aq">Cari</label><input id="aq" type="search" placeholder="Cari produk…" value="${esc(aq)}"><label class="vh" for="ac">Kategori</label><select id="ac"><option value="all">Semua kategori</option>${cs.map(c=>`<option value="${c.id}"${ac==c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div><ul class="al" id="al">${alist()}</ul>`;
if(av=='st'){const s=D.s,f=(k,l,t)=>`<label>${l}${t=='ta'?`<textarea name="${k}" rows="3" required>${esc(s[k])}</textarea>`:`<input name="${k}" required value="${esc(s[k])}">`}</label>`;
b=`<h2>Settings</h2><form class="fm" data-f="set" style="max-width:560px"><p class="er" role="alert"></p>${f('name','Nama toko')}${f('head','Headline halaman utama')}${f('sub','Subheadline')}${f('desc','Deskripsi singkat toko','ta')}${f('wa','Nomor WhatsApp admin (contoh 6285136528880)')}${f('tg','Tautan bukti transaksi Telegram')}${f('foot','Teks footer')}<button class="btn s">Save Settings</button></form>`}
return `<div class="ah gh"><div class="w"><b>${esc(D.s.name)} ✶ <small>admin</small></b><nav class="tabs" aria-label="Admin">${[['ov','Overview'],['mg','Manage Catalog'],['ad','Add Product'],['st','Settings']].map(([k,n])=>`<button data-a="nav" data-id="${k}"${av==k?' class="on" aria-current="page"':''}>${n}</button>`).join('')}<button data-a="ex">Exit admin</button></nav></div></div><main class="w" id="am">${b}</main>${dirty?`<div class="pbar"><span>Perubahan belum live.</span><button class="btn y" id="pb" data-a="pub">Publish changes</button></div>`:''}`}
/* forms */
function md(h){fd=0;$('#ov').innerHTML=`<div class="mb"><div class="mdl fm" role="dialog" aria-modal="true">${h}</div></div>`;const f=$('#ov input,#ov select,#ov button');f&&f.focus()}
const cl=()=>{$('#ov').innerHTML='';fd=0},mark=m=>{dirty=1;render();toast(m)};
function toast(m,b){const t=$('#toast');t.className=b?'ts er2':'ts';t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3600)}
function itemF(it){const n=!it;it=it||{cat:D.c[0]?.id,type:'',dur:'',price:0,unit:'',note:'',pub:1,ord:Math.max(0,...D.i.map(i=>i.ord))+10};
md(`<form data-f="item" data-id="${it.id||''}"><h3>${n?'Add Product':'Edit Product'}</h3><p class="er" role="alert"></p>
<label>Kategori / nama produk<select name="cat">${D.c.map(c=>`<option value="${c.id}"${c.id==it.cat?' selected':''}>${esc(c.name)}</option>`).join('')}<option value="_new">+ Kategori baru…</option></select></label>
<label id="nc" hidden>Nama kategori baru<input name="ncat" maxlength="40"></label>
<label>Jenis paket<input name="type" required maxlength="60" value="${esc(it.type)}"></label><label>Durasi<input name="dur" required maxlength="60" value="${esc(it.dur)}"></label>
<fieldset><legend>Harga</legend><label class="in"><input type="radio" name="pm" value="n"${it.price==null?'':' checked'}> Harga tetap</label><label class="in"><input type="radio" name="pm" value="a"${it.price==null?' checked':''}> Tanya Admin</label><input name="price" type="number" min="0" step="1" inputmode="numeric" value="${it.price??''}" placeholder="20000"></fieldset>
<label>Satuan harga (opsional, mis. verif)<input name="unit" maxlength="12" value="${esc(it.unit)}"></label><label>Catatan / ketentuan<textarea name="note" rows="3" maxlength="300">${esc(it.note)}</textarea></label>
<div class="g2"><label>Status<select name="pub"><option value="1"${it.pub?' selected':''}>Aktif</option><option value="0"${it.pub?'':' selected'}>Nonaktif</option></select></label><label>Urutan<input name="ord" type="number" value="${it.ord}"></label></div>
<div class="ac"><button type="button" class="btn o2" data-a="cancel">Cancel</button><button class="btn s">Save Product</button></div></form>`)}
function catF(c){const n=!c;c=c||{name:'',desc:'',note:'',g:'',pub:1,ord:Math.max(0,...D.c.map(x=>x.ord))+10};
md(`<form data-f="cat" data-id="${c.id||''}"><h3>${n?'Add Category':'Edit Category'}</h3><p class="er" role="alert"></p><label>Nama kategori<input name="name" required maxlength="40" value="${esc(c.name)}"></label><label>Deskripsi (opsional)<input name="desc" maxlength="120" value="${esc(c.desc)}"></label><label>Ketentuan kategori (opsional)<textarea name="note" rows="3" maxlength="300">${esc(c.note)}</textarea></label>
<div class="g2"><label>Monogram (1–2 huruf)<input name="g" maxlength="2" value="${esc(c.g)}"></label><label>Urutan<input name="ord" type="number" value="${c.ord}"></label></div><label>Status<select name="pub"><option value="1"${c.pub?' selected':''}>Tampil</option><option value="0"${c.pub?'':' selected'}>Tersembunyi</option></select></label>
<div class="ac"><button type="button" class="btn o2" data-a="cancel">Cancel</button><button class="btn s">Save Category</button></div></form>`)}
document.onsubmit=e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),k=f.dataset.f,id=f.dataset.id,er=m=>{f.querySelector('.er').textContent=m;f.querySelector('.er').scrollIntoView({block:'nearest'})};
if(k=='item'){let cat=v.cat;if(cat=='_new'){const nm=v.ncat.trim();if(!nm)return er('Isi nama kategori baru.');if(D.c.some(c=>c.name.toLowerCase()==nm.toLowerCase()))return er('Nama kategori sudah ada.');cat=newCat(nm)}
const t=v.type.trim(),d=v.dur.trim();if(!t||!d)return er('Jenis paket dan durasi wajib diisi.');let p=null;if(v.pm=='n'){p=Number(v.price);if(v.price===''||!Number.isFinite(p)||p<0)return er('Harga harus angka 0 atau lebih.');p=Math.round(p)}
if(D.i.some(i=>i.id!=id&&i.cat==cat&&i.type.toLowerCase()==t.toLowerCase()&&i.dur.toLowerCase()==d.toLowerCase()))return er('Paket dengan jenis dan durasi yang sama sudah ada.');
const o={cat,type:t,dur:d,price:p,unit:v.unit.trim(),note:v.note.trim(),pub:+v.pub,ord:Number(v.ord)||0};
if(id)Object.assign(D.i.find(i=>i.id==id),o);else D.i.push({id:'n'+Date.now(),...o});cl();mark('Produk disimpan (draft). Tekan Publish changes agar tampil di katalog.')}
if(k=='cat'){const nm=v.name.trim();if(!nm)return er('Nama kategori wajib diisi.');if(D.c.some(c=>c.id!=id&&c.name.toLowerCase()==nm.toLowerCase()))return er('Nama kategori sudah ada.');
const o={name:nm,desc:v.desc.trim(),note:v.note.trim(),g:(v.g.trim()||nm.slice(0,2)),pub:+v.pub,ord:Number(v.ord)||0};if(id)Object.assign(D.c.find(c=>c.id==id),o);else D.c.push({id:uid(nm),...o});cl();mark('Kategori disimpan (draft).')}
if(k=='set'){const s={};for(const x in v)s[x]=v[x].trim();let w=s.wa.replace(/\D/g,'');if(w[0]=='0')w='62'+w.slice(1);if(w.length<8||w.length>15)return er('Nomor WhatsApp tidak valid.');if(!/^https?:\/\//.test(s.tg))return er('Tautan Telegram harus diawali http:// atau https://');if(!s.name)return er('Nama toko wajib diisi.');D.s={...s,wa:w};mark('Pengaturan disimpan (draft).')}};
const uid=n=>{let b=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'c',x=b,k=1;while(D.c.some(c=>c.id==x))x=b+'-'+ ++k;return x};
function newCat(nm){const id=uid(nm);D.c.push({id,name:nm,desc:'',note:'',g:nm.slice(0,2),pub:1,ord:Math.max(0,...D.c.map(x=>x.ord))+10});return id}
document.onchange=e=>{if(e.target.name=='cat'){const h=e.target.value!='_new';$('#nc').hidden=h;if(!h)$('#nc input').focus()}if(e.target.id=='ac'){ac=e.target.value;$('#al').innerHTML=alist()}};
document.oninput=e=>{if(e.target.closest('.mdl'))fd=1;if(e.target.id=='sq'){q=e.target.value;list()}if(e.target.id=='aq'){aq=e.target.value;$('#al').innerHTML=alist()}};
document.onkeydown=e=>{if(e.key=='Escape'&&$('#ov').innerHTML)act('cancel')};
document.onclick=e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset.id,t)};
function swap(id,d){const cs=[...D.c].sort(by),k=cs.findIndex(c=>c.id==id),j=k+d;if(j<0||j>=cs.length)return;cs.forEach((c,x)=>c.ord=x*10);[cs[k].ord,cs[j].ord]=[cs[j].ord,cs[k].ord];mark('Urutan diubah (draft).')}
function act(a,id,el){const it=D.i.find(i=>i.id==id),c=D.c.find(x=>x.id==id);
if(a=='mm'){const o=$('.hd').classList.toggle('o');el.setAttribute('aria-expanded',o)}
else if(a=='chip'){cf=id;chips();list()}
else if(a=='nav'){av=id;if(id=='ad')av='mg';render();if(id=='ad')itemF()}
else if(a=='cancel'){if(fd&&!confirm('Buang perubahan yang belum disimpan?'))return;cl()}
else if(a=='ex')location.hash='#home';else if(a=='vf')chk(1);
else if(a=='ia')itemF();else if(a=='ie')itemF(it);else if(a=='ca')catF();else if(a=='ce')catF(c);
else if(a=='it'){it.pub=it.pub?0:1;mark(it.pub?'Paket diaktifkan (draft).':'Paket dinonaktifkan (draft).')}
else if(a=='ct'){c.pub=c.pub?0:1;mark('Status kategori diubah (draft).')}
else if(a=='cu')swap(id,-1);else if(a=='cd')swap(id,1);
else if(a=='id')md(`<h3>Delete this product?</h3><p>Produk ini akan dihapus dari katalog. Tindakan ini tidak dapat dibatalkan.</p><div class="ac"><button class="btn o2" data-a="cancel">Cancel</button><button class="btn dg2" data-a="dx" data-id="${id}">Delete Product</button></div>`);
else if(a=='dx'){D.i=D.i.filter(i=>i.id!=id);cl();mark('Produk dihapus (draft).')}
else if(a=='cx'){const n=D.i.filter(i=>i.cat==id).length;md(`<h3>Delete category “${esc(c.name)}”?</h3><p>${n?`Kategori ini masih punya ${n} produk. Pindahkan produk ke kategori lain lebih dulu (lewat Edit), atau hapus kategori beserta semua produknya.`:'Kategori kosong ini akan dihapus. Tindakan ini tidak dapat dibatalkan.'}</p><div class="ac"><button class="btn o2" data-a="cancel">Cancel</button><button class="btn dg2" data-a="cdx" data-id="${id}">${n?`Delete category + ${n} products`:'Delete Category'}</button></div>`)}
else if(a=='cdx'){D.i=D.i.filter(i=>i.cat!=id);D.c=D.c.filter(x=>x.id!=id);if(cf==id)cf='all';if(ac==id)ac='all';cl();mark('Kategori dihapus (draft).')}
else if(a=='pub')pub(el)}
async function pub(b){b.disabled=1;b.textContent='Publishing…';try{art=art||await claude.use('artifact');if(!art)throw{code:'na'};const c=document.documentElement.cloneNode(true);c.querySelector('#data').textContent=ser();['app','ov','toast'].forEach(i=>{const n=c.querySelector('#'+i);n.innerHTML='';n.removeAttribute('class')});c.removeAttribute('data-theme');dirty=0;await art.publish('<!doctype html>\n'+c.outerHTML)}
catch(e){dirty=1;b.disabled=0;b.textContent='Publish changes';toast(e&&(e.code=='not_writer'||e.code=='not_granted')?'Kamu tidak punya izin mempublikasikan perubahan.':e&&e.code=='conflict'?'Ada versi yang lebih baru; halaman akan dimuat ulang.':e&&e.code=='na'?'Fitur publish tidak tersedia di tampilan ini.':'Gagal menyimpan. Coba lagi.',1)}}
async function chk(m){try{const u=await window.claude?.use?.('user');can=!!(u&&u.canEdit())}catch(e){can=0}render();if(m&&!can)toast('Akun ini tidak punya akses admin.',1)}
function render(){adm=location.hash=='#admin';$('#app').innerHTML=adm?ap():pg();if(!adm){chips();list()}}
onhashchange=()=>{if((location.hash=='#admin')!=adm){render();scrollTo(0,0)}};
onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
render();chk(0);
</script>


</body></html>
